<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Data Viewer</title>
</head>

<body>

    <h1>Data Viewer</h1>

    <div>
        <h2>Datasets</h2>

        <ul id="datasets"></ul>
    </div>

    <div>
        <h2 id="dataset-title">Select a dataset</h2>

        <table id="data-table" border="1">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div>
        <h2>Metadata</h2>

        <table id="metadata-table" border="1">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <div>
        <button id="previous">Previous</button>
        <span id="page-info">Page 1</span>
        <button id="next">Next</button>
    </div>

    <script src="/static/script.js"></script>

</body>

</html>
